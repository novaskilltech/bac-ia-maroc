<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="novaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre arrondi (Charte #020617) -->
  <rect width="120" height="120" rx="26" fill="#020617" stroke="url(#novaGrad)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Orbites scientifiques / IA -->
  <ellipse cx="64" cy="60" rx="44" ry="18" transform="rotate(-32 64 60)" stroke="url(#novaGrad)" stroke-width="3" stroke-opacity="0.75"/>
  <ellipse cx="64" cy="60" rx="44" ry="18" transform="rotate(32 64 60)" stroke="url(#novaGrad)" stroke-width="3" stroke-opacity="0.75"/>
  <circle cx="45" cy="28" r="4.5" fill="#06b6d4"/>
  <circle cx="82" cy="28" r="4.5" fill="#d946ef"/>
  <circle cx="44" cy="91" r="4.5" fill="#06b6d4"/>

  <!-- Chapeau Académique & Livre Ouvert (Bac) -->
  <path d="M64 31 L100 48 L64 65 L28 48 Z" fill="#020617" stroke="url(#novaGrad)" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M44 56 V76 C52 78 60 83 64 89 C68 83 76 78 84 76 V56" fill="#020617" stroke="url(#novaGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="64" y1="65" x2="64" y2="89" stroke="url(#novaGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Pompon du Bac & Noeud IA central -->
  <circle cx="64" cy="48" r="4.5" fill="url(#novaGrad)"/>
  <path d="M64 48 L96 50 V69" stroke="url(#novaGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="96" cy="72" r="4.5" fill="#d946ef"/>

  <!-- Étoile NOVA (4 branches lumineuses) -->
  <path d="M28 32 C30 45 33 48 46 50 C33 52 30 55 28 68 C26 55 23 52 10 50 C23 48 26 45 28 32 Z" fill="url(#novaGrad)" filter="url(#novaGlow)"/>
</svg>
